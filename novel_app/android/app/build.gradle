plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lilith.novel'
    compileSdk 34

    defaultConfig {
        applicationId "com.lilith.novel"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Подпись debug-ключом: APK можно сразу установить вручную (sideload)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
