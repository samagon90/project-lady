<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Лилит — визуальная новелла</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<div id="novel">
  <!-- Визуальная новелла: Лилит всегда на экране, эмоции меняются по диалогу -->
  <div id="avatar-wrap">
    <img id="avatar" src="/api/avatar?style=realistic&emotion=neutral" alt="Лилит">
    <div id="emotion-tag" title="Эмоция"></div>
    <div id="mood-tag" title="Раскованность"></div>
    <div id="xp-bar" class="xp-bar" title="Уровень отношений"><div id="xp-fill" class="xp-fill"></div></div>
  </div>

  <!-- Чат -->
  <div id="chat-box">
    <div id="chat-header">
      <span id="speaker">🖤 Лилит</span>
      <span id="level-tag" class="level-tag" title="Уровень отношений"></span>
    </div>
    <div id="chat-log"><div class="hint" id="chat-placeholder">Загрузка…</div></div>
    <div id="quick-chips"></div>
    <div id="input-row">
      <input id="chat-input" type="text" placeholder="Напиши Лилит…" autocomplete="off">
      <button id="clothes-btn" title="В белье / одеться">🩲</button>
      <button id="swipe-btn" title="Другой ответ">🔄</button>
      <button id="send-btn">➤</button>
    </div>
  </div>

  <nav id="mini-nav">
    <button class="tab active" data-tab="chat">💬<span>Чат</span></button>
    <button class="tab" data-tab="scenes">🎭<span>Сцены</span></button>
    <button class="tab" data-tab="diary">📖<span>Дневник</span></button>
    <button class="tab" data-tab="gallery">🖼<span>Галерея</span></button>
    <button class="tab" data-tab="settings">⚙️<span>Ещё</span></button>
  </nav>

  <section id="tab-scenes" class="panel">
    <h2>🎭 Сцены</h2>
    <div id="scenes"><p class="hint">Загрузка…</p></div>
  </section>

  <section id="tab-diary" class="panel">
    <h2>📖 Дневник Лилит</h2>
    <div id="diary"><p class="hint">Загрузка…</p></div>
  </section>

  <section id="tab-settings" class="panel">
    <h2>⚙️ Настройки</h2>
    <label>Имя
      <input id="s-name" placeholder="как тебя называть">
    </label>
    <label>Режим
      <select id="s-mode">
        <option value="0">🤝 Дружеский</option>
        <option value="1">😉 Лёгкий флирт</option>
        <option value="2">💞 Романтический</option>
        <option value="3">🔞 NSFW</option>
      </select>
    </label>
    <label>Стиль
      <select id="s-style">
        <option value="realistic">📸 Реалистичный</option>
        <option value="anime">🖌 Аниме</option>
        <option value="toon">🎬 Мультяшный (как Джессика)</option>
      </select>
    </label>
    <label>Креативность Лилит
      <select id="s-creativity">
        <option value="0">😌 Спокойная</option>
        <option value="1">😏 Стандартная</option>
        <option value="2">🔥 Дерзкая и игривая</option>
      </select>
    </label>
    <label>Длина ответов
      <select id="s-length">
        <option value="0">📏 Коротко</option>
        <option value="1">📖 Средне</option>
        <option value="2">📚 Подробно</option>
      </select>
    </label>
    <label>Наряд
      <input id="s-outfit" placeholder="костюм горничной, чулки">
    </label>
    <label>Манера речи
      <input id="s-speech" placeholder="страстно и дерзко">
    </label>
    <label>День рождения (ММ-ДД)
      <input id="s-birthday" placeholder="напр. 14-02 — я не забуду 🎂">
    </label>
    <label class="check-label">
      <input type="checkbox" id="s-lingerie" checked> 🩲 Лилит всегда в белье
    </label>
    <button id="generate-outfit" class="primary">🎨 Сгенерировать образ в этом наряде</button>
    <button id="save" class="primary">💾 Сохранить настройки</button>
    <div id="save-msg"></div>

    <h2 style="margin-top:18px">💜 О нас</h2>
    <div id="stats"><p class="hint">Загрузка…</p></div>

    <h2 style="margin-top:18px">📤 Пригласить друга</h2>
    <button id="share-btn" class="primary">📤 Поделиться Лилит</button>

    <h2 style="margin-top:18px">🏆 Достижения</h2>
    <div id="achievements"><p class="hint">Загрузка…</p></div>

    <h2 style="margin-top:18px">🧠 Память</h2>
    <div id="memory"><p class="hint">Загрузка…</p></div>
  </section>

  <section id="tab-gallery" class="panel">
    <h2>🖼 Галерея</h2>
    <div id="gallery" class="grid"><p class="hint">Загрузка…</p></div>
  </section>

</div>

<script src="/app.js"></script>
</body>
</html>
